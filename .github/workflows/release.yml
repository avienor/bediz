# Publishes a GitHub Release for each pushed version tag. The build job checks
# the tag, runs the verification commands, and builds the archives with the
# repository-local release command. Only the publish job can write to the
# repository, and it runs only after the build job succeeds.
name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check the tag and the agent skill version
        run: go run ./tools/release -check "$VERSION"

      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go mod verify

      - name: Build the release archives
        run: go run ./tools/release "$VERSION"

      - name: Verify the checksums
        working-directory: dist/${{ env.VERSION }}
        run: sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: dist/${{ env.VERSION }}/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release

      - name: Publish the GitHub Release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c SHA256SUMS
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$VERSION" \
            --generate-notes \
            "${prerelease[@]}" \
            ./*
